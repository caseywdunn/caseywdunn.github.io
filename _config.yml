# Site settings
title: The Dunn Lab
email: casey.dunn@yale.edu
description: "Casey Dunn's laboratory in the Department of Ecology and Evolutionary Biology at Yale University."

# GoatCounter site code, ie the subdomain of <code>.goatcounter.com.
# Leave blank to disable analytics entirely.
goatcounter: 'caseywdunn'

# Color settings (hex-codes without the leading hash-tag)
